spring.application.name=hireflow

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hireflow_db}
spring.datasource.username=${DATABASE_USERNAME:admin}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}

app.jwt.secret=${JWT_SECRET:hireflow-local-development-secret-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}