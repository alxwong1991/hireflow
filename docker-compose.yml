services:
  postgres:
    image: postgres:16
    container_name: hireflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hireflow_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
  adminer:
    image: adminer
    container_name: hireflow-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: